<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Homes for Lost Dogs</title>

<body>

  <section id="home" class="home">

    <div class="title">
      <div class="logo-box">
        <img class="logo" src="img/logo.png" alt="logo">
      </div>

      <div class="title-box">
        <h1 class="title-desc">Search nearby animal shelters for dogs in need for a new home!</h1>
      </div>
    </div>

    <div class="search">
      <form id="search-form">
        <div class="search-element">
          <p class="search-title">Zip Code</p>
          <input type="text" id="zip" class="form-entry" autocomplete="off">
        </div>
        <div class="search-element">
          <p class="search-title">Distance (mi)</p>
          <input type="number" id="distance" class="form-entry" autocomplete="off">
        </div>
        <div class="search-element">
          <input id="search-btn" type="submit" value="Search!" class="search-btn">
        </div>
      </form>
    </div>

  </section>

  <!-- <button type="submit" id="next-page" class="search-btn">Next</button>
  <button type="submit" id="previous-page" class="search-btn">Previous</button> -->
